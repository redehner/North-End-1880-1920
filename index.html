<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bombay and Its World</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
    #map { height: 100%; width: 100%; }
    .title-card {
      position: absolute; top: 14px; left: 14px; z-index: 1000;
      background: #fff; padding: 12px 16px; border-radius: 8px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.3); max-width: 320px;
    }
    .title-card h1 { margin: 0 0 4px; font-size: 1.1rem; }
    .title-card p  { margin: 0; font-size: 0.85rem; color: #444; }
    .popup-name { font-weight: 600; font-size: 1rem; margin-bottom: 2px; }
    .popup-date { color: #666; font-size: 0.82rem; margin-bottom: 6px; }
    .popup-desc { font-size: 0.9rem; line-height: 1.35; }
  </style>
</head>
<body>
  <div class="title-card">
    <h1>Bombay and Its World</h1>
    <p>Click any point to read about it. Click it again to zoom in.</p>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
  const MAIN_PLACE = "Bombay";
  const START_ZOOM = 4;
  const CLICK_ZOOM = 12;

  const data = {
    "type": "FeatureCollection",
    "features": [
      {"type":"Feature","properties":{"Name":"Bombay","Date":"1880s","Description":"The cotton-mill capital of western India, in Maharashtra. This is the MAIN place."},"geometry":{"type":"Point","coordinates":[72.8258,18.9750]}},
      {"type":"Feature","properties":{"Name":"Girangaon","Date":"1880s","Description":"The mill district at the heart of Bombay, where much of the textile workforce lived and worked."},"geometry":{"type":"Point","coordinates":[72.8300,18.9900]}},
      {"type":"Feature","properties":{"Name":"Bombay Harbour","Date":"19th century","Description":"The deep-water port that made Bombay a hub for cotton exports and imports."},"geometry":{"type":"Point","coordinates":[72.8400,18.9200]}},
      {"type":"Feature","properties":{"Name":"Elephanta Caves","Date":"ancient","Description":"Rock-cut temples on an island in Bombay Harbour, part of the region's older layered history."},"geometry":{"type":"Point","coordinates":[72.9315,18.9633]}},
      {"type":"Feature","properties":{"Name":"Pune","Date":"19th century","Description":"A major inland Maharashtra city connected to Bombay by trade and, later, rail."},"geometry":{"type":"Point","coordinates":[73.8567,18.5204]}},
      {"type":"Feature","properties":{"Name":"Nashik","Date":"19th century","Description":"A Maharashtra city on the Godavari, linked to Bombay through regional trade and pilgrimage routes."},"geometry":{"type":"Point","coordinates":[73.7898,19.9975]}},
      {"type":"Feature","properties":{"Name":"Nagpur","Date":"19th century","Description":"A central-Maharashtra city and a cotton-growing and trading center feeding the mills."},"geometry":{"type":"Point","coordinates":[79.0882,21.1458]}},
      {"type":"Feature","properties":{"Name":"Kolhapur","Date":"19th century","Description":"A city in southern Maharashtra tied into regional textile and trade networks."},"geometry":{"type":"Point","coordinates":[74.2433,16.7050]}},
      {"type":"Feature","properties":{"Name":"Ratnagiri","Date":"1880s","Description":"A Konkan-coast district that sent many migrant workers to Bombay's mills."},"geometry":{"type":"Point","coordinates":[73.3120,16.9902]}},
      {"type":"Feature","properties":{"Name":"Ahmednagar","Date":"19th century","Description":"An inland Maharashtra town connected to Bombay through regional commerce."},"geometry":{"type":"Point","coordinates":[74.7480,19.0948]}},
      {"type":"Feature","properties":{"Name":"Solapur","Date":"19th century","Description":"A Maharashtra textile town and a center of cotton weaving connected to Bombay."},"geometry":{"type":"Point","coordinates":[75.9064,17.6599]}},
      {"type":"Feature","properties":{"Name":"Manchester","Date":"19th century","Description":"The center of Britain's cotton industry; source of mill machinery and a competitor to Bombay's mills."},"geometry":{"type":"Point","coordinates":[-2.2426,53.4808]}},
      {"type":"Feature","properties":{"Name":"Liverpool","Date":"19th century","Description":"The British port through which cotton and goods moved between Britain and Bombay."},"geometry":{"type":"Point","coordinates":[-2.9916,53.4084]}},
      {"type":"Feature","properties":{"Name":"London","Date":"19th century","Description":"The imperial capital and financial center that shaped Bombay's trade and industry."},"geometry":{"type":"Point","coordinates":[-0.1278,51.5074]}},
      {"type":"Feature","properties":{"Name":"Shanghai","Date":"1890s","Description":"A major overseas market for Bombay mill yarn across the Indian Ocean and to East Asia."},"geometry":{"type":"Point","coordinates":[121.4737,31.2304]}},
      {"type":"Feature","properties":{"Name":"Hong Kong","Date":"19th century","Description":"A British trading hub on the route east, linked to Bombay's export trade."},"geometry":{"type":"Point","coordinates":[114.1694,22.3193]}},
      {"type":"Feature","properties":{"Name":"Singapore","Date":"19th century","Description":"A key entrepot on the shipping route between Bombay and East Asia."},"geometry":{"type":"Point","coordinates":[103.8198,1.3521]}},
      {"type":"Feature","properties":{"Name":"Zanzibar","Date":"19th century","Description":"An Indian Ocean market for Indian cotton cloth through long-standing trade networks."},"geometry":{"type":"Point","coordinates":[39.2026,-6.1659]}},
      {"type":"Feature","properties":{"Name":"Aden","Date":"19th century","Description":"A coaling and trade waypoint on the sea route between Bombay and Europe."},"geometry":{"type":"Point","coordinates":[45.0367,12.7794]}},
      {"type":"Feature","properties":{"Name":"Suez","Date":"1869","Description":"The canal, opened in 1869, that shortened the sea route between Bombay and Britain."},"geometry":{"type":"Point","coordinates":[32.5498,29.9668]}},
      {"type":"Feature","properties":{"Name":"Yokohama","Date":"late 19th century","Description":"A Japanese port connected to Bombay through East Asian trade."},"geometry":{"type":"Point","coordinates":[139.6380,35.4437]}}
    ]
  };

  const map = L.map("map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  function nameOf(props) { return (props && (props.Name || props.name || props.label)) || ""; }

  let mainLatLng = null;
  const layer = L.geoJSON(data, {
    pointToLayer: function (feature, latlng) {
      const isMain = nameOf(feature.properties) === MAIN_PLACE;
      if (isMain) mainLatLng = latlng;
      return L.circleMarker(latlng, {
        radius: isMain ? 11 : 7,
        fillColor: isMain ? "#c0392b" : "#2c5f8a",
        color: "#ffffff", weight: 2, fillOpacity: 0.9
      });
    },
    onEachFeature: function (feature, lyr) {
      const p = feature.properties || {};
      const name = p.Name || p.name || p.label || "Untitled";
      const date = p.Date || p.date || "";
      const desc = p.Description || p.description || "";
      lyr.bindPopup(
        '<div class="popup-name">' + name + "</div>" +
        (date ? '<div class="popup-date">' + date + "</div>" : "") +
        '<div class="popup-desc">' + desc + "</div>"
      );
      lyr.on("click", function () { if (lyr.getLatLng) map.flyTo(lyr.getLatLng(), CLICK_ZOOM); });
    }
  }).addTo(map);

  if (mainLatLng) { map.setView(mainLatLng, START_ZOOM); }
  else if (layer.getBounds().isValid()) { map.fitBounds(layer.getBounds(), { padding: [40, 40] }); }
  </script>
</body>
</html>
